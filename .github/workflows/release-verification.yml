name: Release verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - pre-release
      - "release/**"

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck tests and API
        run: npm run test:typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build API and frontend
        run: npm run build

  docker:
    name: Docker Compose and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and start Compose stack
        run: docker compose up --build --detach

      - name: Wait for healthy services
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:4000/health >/dev/null \
              && curl --fail --silent http://localhost:3000 >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Verify seeded API
        shell: bash
        run: |
          curl --fail --silent http://localhost:4000/api/zones | grep --quiet Banani

      - name: Install host test dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Configure isolated integration environment
        shell: bash
        run: |
          cat > .env.test <<'EOF'
          TEST_DATABASE_URL=postgresql://postgres:dhaka_tesla_dev_password@localhost:5432/dhaka_tesla_pool?schema=public
          TEST_DIRECT_URL=postgresql://postgres:dhaka_tesla_dev_password@localhost:5432/dhaka_tesla_pool?schema=public
          EOF

      - name: Run real API and concurrency integration tests
        run: npm run test:integration

      - name: Show logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans